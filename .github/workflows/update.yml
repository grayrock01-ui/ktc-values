name: Update KTC values
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - run: python scrape.py
      - run: |
          git config user.name ktc-bot
          git config user.email ktc-bot@users.noreply.github.com
          git add ktc.csv
          git diff --staged --quiet || git commit -m "KTC values"
          git push
